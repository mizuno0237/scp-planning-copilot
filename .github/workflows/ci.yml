name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scp-planning-copilot
      - uses: actions/checkout@v4
        with:
          repository: mizuno0237/pixi-gantt
          path: pixi-gantt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scp-planning-copilot/package-lock.json
      - run: npm ci
        working-directory: scp-planning-copilot
      - run: npm test
        working-directory: scp-planning-copilot
      - run: npm run build
        working-directory: scp-planning-copilot
